# Ephemeral EKS 1.35 + Karpenter + Bottlerocket git-worker pool (ADR-002 workplace reference).
# Create:  ./scripts/eks-karpenter-up.sh
# Destroy: ./scripts/eks-karpenter-down.sh
#
# Bootstrap Bottlerocket nodes run Karpenter + core addons. Git CSI workers are also
# Bottlerocket, provisioned by Karpenter (EC2NodeClass with extra /dev/xvdb).
apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: adr002-git-csi-karpenter
  region: us-east-1
  version: "1.35"
  tags:
    project: adr-002
    purpose: karpenter-bottlerocket-git-csi
    karpenter.sh/discovery: adr002-git-csi-karpenter

iam:
  withOIDC: true

addons:
  - name: vpc-cni
  - name: coredns
  - name: kube-proxy
  - name: aws-ebs-csi-driver
    wellKnownPolicies:
      ebsCSIController: true

# K8s 1.35 requires Karpenter >= 1.9 (see karpenter.sh/docs/upgrading/compatibility).
karpenter:
  version: "1.9.0"
  createServiceAccount: true
  withSpotInterruptionQueue: true

managedNodeGroups:
  - name: karpenter-bootstrap
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 50
    volumeType: gp3
    amiFamily: Bottlerocket
    privateNetworking: false
    labels:
      adr002.io/role: system
    tags:
      adr002.io/nodegroup: karpenter-bootstrap
    iam:
      withAddonPolicies:
        imageBuilder: true
    bottlerocket:
      enableAdminContainer: true
      settings:
        motd: "ADR-002 Karpenter bootstrap (Bottlerocket)"
