# Temporary DaemonSet to verify node bootstrap mounted /mnt/git-storage.
apiVersion: v1
kind: Namespace
metadata:
  name: adr001-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: git-storage-verify
  namespace: adr001-system
spec:
  selector:
    matchLabels:
      app: git-storage-verify
  template:
    metadata:
      labels:
        app: git-storage-verify
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: verify
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sleep", "3600"]
          securityContext:
            privileged: true
          volumeMounts:
            - name: git-storage
              mountPath: /mnt/git-storage
      volumes:
        - name: git-storage
          hostPath:
            path: /mnt/git-storage
            type: Directory
