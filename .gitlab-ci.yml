# Trigger when a Git tag is created/pushed (ws-publish share → ws/<user>/<id>).
# GitLab sets CI_COMMIT_TAG for tag pipelines; branch pushes do not set it.

workflow:
  rules:
    # Any tag:
    # - if: $CI_COMMIT_TAG
    # Share tags only (recommended — skip v1.2.3 / release tags):
    - if: $CI_COMMIT_TAG =~ /^ws\//
    - when: never

stages:
  - notify

# Example job: runs only on ws/* tag pipelines.
on-ws-tag:
  stage: notify
  rules:
    - if: $CI_COMMIT_TAG =~ /^ws\//
  script:
    - echo "tag=$CI_COMMIT_TAG sha=$CI_COMMIT_SHA"
    - echo "CONFIG_PATH hint: /mnt/git/tags/${CI_COMMIT_TAG}"
    # TODO: optional wait/notify that replica materialized ACTIVE_TAGS
