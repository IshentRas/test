apiVersion: v1
kind: Namespace
metadata:
  name: adr001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: reconciler
  namespace: adr001
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: app
  namespace: adr001
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-state-reader
  namespace: adr001
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["git-release-state"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: release-state-writer
  namespace: adr001
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: ["git-release-state"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: reconciler-release-state
  namespace: adr001
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-state-reader
subjects:
  - kind: ServiceAccount
    name: reconciler
    namespace: adr001
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: app-release-state
  namespace: adr001
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: release-state-writer
subjects:
  - kind: ServiceAccount
    name: app
    namespace: adr001
