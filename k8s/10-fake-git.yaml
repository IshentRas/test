apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-git
  namespace: adr001
spec:
  replicas: 1
  # Avoid dual-pod Ready races with Never-pull local tags during quest restarts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: fake-git
  template:
    metadata:
      labels:
        app: fake-git
    spec:
      containers:
        - name: fake-git
          image: adr001-fake-git:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          readinessProbe:
            httpGet:
              path: /state.json
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /state.json
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: fake-git
  namespace: adr001
spec:
  selector:
    app: fake-git
  ports:
    - name: http
      port: 8080
      targetPort: http
